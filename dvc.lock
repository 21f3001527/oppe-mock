schema: '2.0'
stages:
  train:
    cmd: python scripts/train.py
    deps:
    - path: feature_repo/feature_store.yaml
      hash: md5
    - path: feature_repo/features.py
      hash: md5
    - path: processed_data/stock_data.parquet
      hash: md5
    - path: scripts/train.py
      hash: md5
    outs:
    - path: models/best_model.pkl
      hash: md5
  process_data:
    cmd: python scripts/process_data.py
    deps:
    - path: data/raw/iris.csv
      hash: md5
    - path: scripts/process_data.py
      hash: md5
    outs:
    - path: processed_data/stock_data.parquet
      hash: md5
