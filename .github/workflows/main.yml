name: MLOps CI Pipeline

on:
  push:
    branches: [main]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc g++ make

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: DVC Pull
        run: dvc pull || echo "DVC pull skipped"

      - name: Process Data
        run: python scripts/process_data.py

      - name: Feast Apply
        run: feast -c feature_repo apply

      - name: Feast Materialize
        run: python feature_repo/materialize.py

      - name: Train Model
        env:
          MLFLOW_TRACKING_URI: ${{ github.workspace }}/mlruns
        run: python scripts/train.py

      - name: DVC Push
        run: dvc push || echo "DVC push skipped"

      - name: Verify Model
        run: |
          ls -la models/
          python -c "import joblib; m=joblib.load('models/best_model.pkl'); print('Model OK:', type(m).__name__)"
