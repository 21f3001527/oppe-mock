name: MLOps CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Authenticate with GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-key.json" >> $GITHUB_ENV

      - name: Configure DVC remote
        run: |
          dvc remote add -d gcs_remote gs://feastt/dvc --force || true

      - name: Pull DVC data
        run: |
          dvc pull || echo "DVC pull skipped"

      - name: Run Data Processing
        run: |
          python scripts/process_data.py

      - name: Apply Feast Definitions
        run: |
          cd feature_repo && feast apply && cd ..

      - name: Materialize Feast Features
        run: |
          python feature_repo/materialize.py

      - name: Train Model
        env:
          MLFLOW_TRACKING_URI: ./mlruns
        run: |
          python scripts/train.py

      - name: Push DVC outputs
        run: |
          dvc push || echo "DVC push skipped"

      - name: Verify model artifact
        run: |
          ls -la models/
          python -c "import joblib; m = joblib.load('models/best_model.pkl'); print('Model OK:', type(m).__name__)"
